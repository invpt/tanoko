name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Get week number
        id: date
        run: echo "week=$(date +'%Y-W%U')" >> $GITHUB_OUTPUT
      - name: Get generator files hash
        id: generator-hash
        run: echo "hash=$(find generator -type f -name '*.go' -o -name 'go.mod' -o -name 'go.sum' | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT
      - name: Cache generator inputs
        uses: actions/cache@v4
        with:
          path: generator/cache
          key: generator-cache-${{ steps.date.outputs.week }}
          restore-keys: |
            generator-cache-
      - name: Cache generator outputs
        id: cache-generator-outputs
        uses: actions/cache@v4
        with:
          path: |
            generator/generator
            dist
            datafiles
          key: generator-outputs-${{ steps.generator-hash.outputs.hash }}
          restore-keys: |
            generator-outputs-
      - name: Download rclone
        run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip rclone-current-linux-amd64.zip
          mv rclone-*-linux-amd64/rclone .
          chmod +x rclone
      - name: Configure rclone
        env:
          ACCESS_KEY_ID: ${{ secrets.access_key_id }}
          SECRET_ACCESS_KEY: ${{ secrets.secret_access_key }}
          ENDPOINT: ${{ secrets.endpoint }}
        run: |
          mkdir -p ~/.config/rclone
          cat >> ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $ACCESS_KEY_ID
          secret_access_key = $SECRET_ACCESS_KEY
          region = auto
          endpoint = $ENDPOINT
          EOF
      - name: Install font tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libharfbuzz-bin woff2
      - name: Install dependencies
        run: pnpm install
      - name: Generate assets
        if: steps.cache-generator-outputs.outputs.cache-hit != 'true'
        run: |
          cd generator
          go build -o generator .
          ./generator
      - name: Build
        if: steps.cache-generator-outputs.outputs.cache-hit != 'true'
        env:
          DATA_BASE_URL: https://data.tanoko.org/
        run: |
          mkdir -p dist
          rm -r dist/
          pnpm run build
      - name: Separate bin and woff2 files
        if: steps.cache-generator-outputs.outputs.cache-hit != 'true'
        run: |
          mkdir -p datafiles
          rm -r datafiles/
          mkdir datafiles
          mv dist/**/*.{bin,woff2} datafiles/
      - name: Deploy datafiles
        run: ./rclone sync datafiles/ r2:tanoko/
      - name: Deploy app
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=tanoko
