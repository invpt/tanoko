name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Get week number
        id: date
        run: echo "week=$(date +'%Y-W%U')" >> $GITHUB_OUTPUT
      - name: Cache generator files
        uses: actions/cache@v4
        with:
          path: generator/cache
          key: generator-cache-${{ steps.date.outputs.week }}
          restore-keys: |
            generator-cache-
      - name: Install dependencies
        run: pnpm install
      - name: Generate assets
        run: |
          cd generator
          go build -o generator .
          ./generator
      - name: Build
        run: pnpm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          directory: dist
          projectName: tanoko
