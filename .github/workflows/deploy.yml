name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Get week number
        id: date
        run: echo "week=$(date +'%Y-W%U')" >> $GITHUB_OUTPUT
      - name: Cache generator files
        uses: actions/cache@v4
        with:
          path: generator/cache
          key: generator-cache-${{ steps.date.outputs.week }}
          restore-keys: |
            generator-cache-
      - name: Download rclone
        run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip rclone-current-linux-amd64.zip
          mv rclone-*-linux-amd64/rclone .
          chmod +x rclone
      - name: Configure rclone
        env:
          ACCESS_KEY_ID: ${{ secrets.access_key_id }}
          SECRET_ACCESS_KEY: ${{ secrets.secret_access_key }}
          ENDPOINT: ${{ secrets.endpoint }}
        run: |
          mkdir -p ~/.config/rclone
          cat >> ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $ACCESS_KEY_ID
          secret_access_key = $SECRET_ACCESS_KEY
          region = auto
          endpoint = $ENDPOINT
          EOF
      - name: Install dependencies
        run: pnpm install
      - name: Generate assets
        run: |
          cd generator
          go build -o generator .
          ./generator
      - name: Build
        run: pnpm run build
      - name: Deploy with rclone
        run: ./rclone sync dist/ r2:tanoko/
